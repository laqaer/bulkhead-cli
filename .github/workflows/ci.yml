name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bulkhead-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow action references are immutable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reject mutable third-party action references
        shell: bash
        run: |
          set -euo pipefail

          # Match both step-level actions (`- uses:`) and job-level reusable
          # workflows (`uses:`). Local actions and Docker references are not
          # GitHub repository refs and are outside this SHA-pinning rule.
          mapfile -t action_lines < <(
            grep -RInE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*[^[:space:]#]+' .github/workflows || true
          )

          bad=()
          for line in "${action_lines[@]}"; do
            spec="${line#*uses:}"
            spec="${spec%%#*}"
            spec="$(xargs <<< "${spec}")"

            case "${spec}" in
              ./*|docker://*)
                continue
                ;;
            esac

            ref="${spec##*@}"
            if [[ ! "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              bad+=("${line}")
            fi
          done

          if [ "${#bad[@]}" -ne 0 ]; then
            echo "::error::Every remote GitHub Action and reusable workflow must be pinned to a full 40-character commit SHA."
            printf '%s\n' "${bad[@]}"
            exit 1
          fi

  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test source and built CLI
        run: npm test
      - name: Verify publish contents
        run: npm pack --dry-run

  clean-install-smoke:
    name: Clean package install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack and install exactly what npm would receive
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          test -f "$tarball"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          test -x node_modules/.bin/bulkhead
          node_modules/.bin/bulkhead --help >/dev/null
